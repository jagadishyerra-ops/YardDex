# Deploys YardDex to Firebase (https://yarddex-6150d.web.app) whenever code is pushed.
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  the JSON key of a Google Cloud service account allowed to deploy
#   ANTHROPIC_API_KEY         your Claude API key; copied into Firebase Secret Manager when it changes
name: Deploy to Firebase

on:
  push:
    branches: [main, ccr-c9f34fea-l6o8js]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: yarddex-6150d
  PROJECT_NUMBER: "146622436381"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check that the secrets are set
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=0
          [ -n "$SA" ]  || { echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Settings → Secrets and variables → Actions), then re-run this job."; missing=1; }
          [ -n "$KEY" ] || { echo "::error::Add the ANTHROPIC_API_KEY secret (Settings → Secrets and variables → Actions), then re-run this job."; missing=1; }
          [ -n "${{ secrets.ADMIN_EMAILS }}" ] || echo "::warning::No ADMIN_EMAILS secret, so nobody can open /admin. Add one with your Google email to use the admin dashboard."
          exit $missing

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install function dependencies
        working-directory: functions
        run: npm ci

      - name: Run tests
        working-directory: functions
        run: npm test

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Turn on the Google Cloud services Firebase needs
        run: |
          gcloud services enable --project "$PROJECT_ID" \
            cloudfunctions.googleapis.com cloudbuild.googleapis.com run.googleapis.com \
            artifactregistry.googleapis.com secretmanager.googleapis.com compute.googleapis.com \
            firebaserules.googleapis.com firebasestorage.googleapis.com eventarc.googleapis.com \
            cloudbilling.googleapis.com firebaseextensions.googleapis.com pubsub.googleapis.com

      - name: Grant the permissions Firebase needs (safe to repeat)
        run: |
          grant() {
            gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$1" --role="$2" \
              --condition=None --quiet >/dev/null \
              && echo "ok: $2 for $1" \
              || echo "::warning::Couldn't grant $2 to $1. If the deploy fails, re-run this job in a few minutes."
          }
          # Lets storage.rules check family membership in Firestore.
          grant "service-${PROJECT_NUMBER}@gcp-sa-firebasestorage.iam.gserviceaccount.com" roles/firebaserules.firestoreServiceAgent
          # Lets Cloud Build build the functions in newer projects.
          grant "${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" roles/cloudbuild.builds.builder

      - name: Store the Anthropic key in Firebase (only when it changed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          current="$(firebase functions:secrets:access ANTHROPIC_API_KEY --project "$PROJECT_ID" 2>/dev/null || true)"
          if [ "$current" != "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | firebase functions:secrets:set ANTHROPIC_API_KEY --data-file=- --project "$PROJECT_ID" --non-interactive --force
            echo "Anthropic key stored."
          else
            echo "Anthropic key unchanged."
          fi

      - name: Add the admin list (kept in a GitHub secret, not in the code)
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          list="$(printf '%s' "$ADMIN_EMAILS" | tr -d '\n\r |')"
          sed -i "s|^ADMIN_EMAILS=.*|ADMIN_EMAILS=${list:-none}|" functions/.env
          if [ -n "$list" ]; then echo "Admin list added."; else echo "No admins set (ADMIN_EMAILS secret is empty)."; fi

      - name: Deploy (website, functions, rules)
        # Google's function builds sometimes fail with "An unexpected error occurred", especially on a
        # new project. Try up to three times before giving up.
        run: |
          for attempt in 1 2 3; do
            firebase deploy --project "$PROJECT_ID" --non-interactive --force && exit 0
            echo "::warning::Deploy attempt $attempt failed; retrying in 60 seconds."
            sleep 60
          done
          echo "::error::Deploy failed 3 times. Open the Cloud Build link in the log above to see why."
          exit 1

      - name: Make sure the app can reach the functions (safe to repeat)
        # If a function's first creation fails half-way, Google can leave it without public access, and every
        # call is rejected before reaching our code. The functions still check Firebase sign-in themselves.
        run: |
          for f in identify family admin; do
            gcloud run services add-iam-policy-binding "$f" --region us-east1 --project "$PROJECT_ID" \
              --member=allUsers --role=roles/run.invoker --quiet >/dev/null && echo "ok: $f reachable" \
              || echo "::warning::Couldn't open $f to the app"
          done

      - name: Let the app read photos back for lithophanes
        run: gcloud storage buckets update "gs://${PROJECT_ID}.firebasestorage.app" --cors-file=cors.json

      - name: Done
        run: echo "### Live at https://${PROJECT_ID}.web.app" >> "$GITHUB_STEP_SUMMARY"
